name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-unit:
    name: Static Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify OKF documentation format
        run: npm run lint:okf

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint static analysis
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Vitest unit tests & coverage (100% threshold)
        run: npm run test:coverage

  vrt-and-e2e:
    name: VRT, E2E & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure APT mirrors and timeouts
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries
          echo 'Acquire::http::Timeout "60";' | sudo tee -a /etc/apt/apt.conf.d/99-retries
          echo 'Acquire::https::Timeout "60";' | sudo tee -a /etc/apt/apt.conf.d/99-retries

      - name: Install Japanese Fonts & System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update --fix-missing || sudo apt-get update
          sudo apt-get install -y --no-install-recommends --fix-missing \
            fonts-dejavu-core \
            fonts-noto-cjk \
            fonts-ipaexfont \
            fonts-morisawa-bizud-mincho \
            fonts-morisawa-bizud-gothic \
            fonts-klee

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Storybook VRT (1280px / 375px)
        run: npm run test:vrt

      - name: Production build
        run: npm run build

      - name: Playwright integration tests (IT)
        run: npx playwright test -c playwright.it.config.ts

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/

  android-compile:
    name: Android Java Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Compile Android Java
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew compileDebugJavaWithJavac

  quality-gate:
    name: Lint, Test & Quality Gates
    needs: [lint-and-unit, vrt-and-e2e, android-compile]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Verify all quality gates passed
        run: |
          if [ "${{ needs.lint-and-unit.result }}" != "success" ] || [ "${{ needs.vrt-and-e2e.result }}" != "success" ] || [ "${{ needs.android-compile.result }}" != "success" ]; then
            echo "Quality Gate Failed: lint-and-unit=${{ needs.lint-and-unit.result }}, vrt-and-e2e=${{ needs.vrt-and-e2e.result }}, android-compile=${{ needs.android-compile.result }}"
            exit 1
          fi
          echo "All quality gate checks passed successfully."
